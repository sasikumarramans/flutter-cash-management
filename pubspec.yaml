name: ev_flutter_app

description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.44+44

environment:
  sdk: ">=3.5.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI Packages
  loader_overlay: 5.0.0
  flutter_native_splash: 2.4.1
  flutter_svg: 2.0.10+1
  wakelock_plus: 1.2.8
  mesh_gradient: 1.3.8
  pinput: 5.0.0
  timer_count_down: 2.2.2
  another_flushbar: 1.12.30
  text_scroll: 0.2.0
  readmore: 3.0.0
  badges: 3.1.2
  shimmer: 3.0.0
  smooth_page_indicator: 1.2.0+3
  visibility_detector: 0.4.0+2
  back_button_interceptor: 8.0.4
  fluttertoast: 8.2.12
  flutter_portal: 1.1.4
  super_tooltip: 2.0.9
  flutter_timezone: ^4.1.1
  showcaseview: 4.0.1


  # Architecture & State Management
  get_it: 8.0.0
  bloc: 9.0.0
  flutter_bloc: 9.1.1
  equatable: 2.0.7
  go_router: 16.1.0
  shared_preferences: 2.3.2
  intl: 0.20.2

  # Firebase
  firebase_core: 3.12.1
  firebase_crashlytics: 4.3.4
  firebase_messaging: 15.2.4
  cloud_firestore: 5.6.5
  firebase_remote_config: 5.4.2

  # Network & Storage
  dio: 5.7.0
  pretty_dio_logger: 1.4.0
  hive: 2.2.3
  hive_generator: 2.0.1
  hive_flutter: 1.1.0
  path_provider: 2.1.5
  webview_flutter: 4.10.0
  cached_network_image: 3.4.1
  flutter_cache_manager: 3.4.1
  gal: 2.3.2

  # Secure Storage & Environment
  flutter_secure_storage: 9.2.2
  envied: 1.1.1

  # Device Permissions & Info
  permission_handler: 11.3.1
  permission_handler_platform_interface: 4.2.3
  device_info_plus: 11.3.0
  package_info_plus: ^8.3.0

  # Utility Packages
  url_launcher: 6.3.1
  collection: 1.19.1
  logger: 2.4.0
  uuid: 4.5.1
  percent_indicator: 4.0.1
  get_thumbnail_video: 0.7.3
  share_plus: 10.1.4
  logging: 1.3.0
  flutter_keyboard_visibility: 6.0.0
  extended_text_field: 16.0.2

  # Other UI Utilities
  cupertino_icons: 1.0.6
  typed_data: 1.4.0
  extended_image: 9.1.0
  dotted_border: 2.1.0
  sheet: 1.0.0
  path_parsing: ^1.1.0

  # Image Picker & Compression
  image_picker: 1.1.2
  file_picker: 10.1.9
  flutter_image_compress: 2.3.0
  path: 1.9.1
  image: 4.3.0
  crop_your_image: 2.0.0

  # Notifications
  flutter_local_notifications: 19.3.1

  # Animations
  lottie: 3.1.2
  bounce: 1.0.2

  # In App Update
  in_app_update: 4.2.3

dependency_overrides:
  webview_flutter_android: 4.0.0
  path_provider_android: 2.2.15
  #video_player_android: 2.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 3.0.0
  build_runner: 2.4.13
  flutter_gen_runner: 5.7.0
  flutter_flavorizr: 2.2.3
  flutter_launcher_icons: 0.14.2
  envied_generator: 1.1.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - assets/fonts/

  fonts:
    - family: Causten
      fonts:
        - asset: assets/fonts/Causten-Regular.otf
          weight: 400
        - asset: assets/fonts/Causten-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Causten-Bold.otf
          weight: 700
        - asset: assets/fonts/Causten-Medium.otf
          weight: 500
        - asset: assets/fonts/Causten-Light.otf
          weight: 300
        - asset: assets/fonts/Causten-Thin.otf
          weight: 100
        - asset: assets/fonts/Causten-Black.otf
          weight: 900

flutter_intl:
  enabled: true
  class_name: S
  main_locale: en

flutter_gen:
  output: lib/generated/
  integrations:
    flutter_svg: true
